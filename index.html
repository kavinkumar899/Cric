<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekend Cricket Team Splitter</title>
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-light: #94a3b8;
            --border: #334155;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 16px; line-height: 1.5; }
        .container { max-width: 650px; margin: 0 auto; background: var(--card-bg); border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.3); padding: 20px; border: 1px solid var(--border); }
        h1 { font-size: 1.5rem; text-align: center; color: var(--primary); margin-bottom: 4px; }
        .subtitle { text-align: center; color: var(--text-light); font-size: 0.875rem; margin-bottom: 20px; }
        .section { margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
        .section:last-child { border-bottom: none; }
        h2 { font-size: 1.1rem; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; color: var(--text); }
        button { background: var(--primary); color: #000; border: none; padding: 12px 16px; border-radius: 8px; font-weight: 700; cursor: pointer; width: 100%; font-size: 1rem; transition: background 0.2s; }
        button:hover { background: #059669; color: #fff; }
        button.secondary { background: #475569; color: #fff; }
        button.secondary:hover { background: #334155; }
        .player-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; max-height: 300px; overflow-y: auto; padding: 8px; border: 1px solid var(--border); border-radius: 8px; background: #0f172a; }
        .player-chip { display: flex; align-items: center; background: #1e293b; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem; cursor: pointer; user-select: none; font-weight: 500; color: var(--text); }
        .player-chip input { margin-right: 8px; accent-color: var(--primary); width: 16px; height: 16px; cursor: pointer; }
        .teams-container { display: flex; flex-direction: column; gap: 16px; margin-top: 15px; }
        .team-card { background: #0f172a; border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
        .team-title { font-weight: 700; color: var(--primary); margin-bottom: 8px; font-size: 1.05rem; }
        ul { list-style-type: none; padding-left: 0; }
        li { padding: 6px 0; border-bottom: 1px dashed var(--border); font-size: 0.95rem; color: var(--text); }
        li:last-child { border-bottom: none; }
        .admin-panel { background: #334155; border: 1px solid #475569; padding: 12px; border-radius: 8px; margin-bottom: 16px; }
        input[type="text"], input[type="number"], input[type="password"] { width: 100%; padding: 8px; background: #0f172a; color: var(--text); border: 1px solid var(--border); border-radius: 6px; margin-bottom: 8px; }
        .row { display: flex; gap: 8px; }
        .actions-row { display: flex; gap: 8px; margin-top: 10px; }
        .admin-link { font-size: 0.8rem; color: var(--text-light); text-decoration: none; cursor: pointer; }
        .admin-link:hover { text-decoration: underline; color: var(--primary); }
    </style>
</head>
<body>
<div class="container">
    <h1>🏏 Weekend Squad Splitter</h1>
    <p class="subtitle">Select playing members to auto-generate balanced teams</p>

    <!-- Selection Section -->
    <div class="section">
        <h2>Match Day Attendance (<span id="selected-count">0</span> active)
            <span class="admin-link" onclick="toggleAdmin(event)">⚙️ Admin</span>
        </h2>

        <!-- Admin Login -->
        <div id="admin-login" class="admin-panel" style="display: none;">
            <input type="password" id="admin-pin" placeholder="Enter Admin PIN (5467)">
            <button onclick="verifyPin()">Unlock Roster Settings</button>
        </div>

        <!-- Admin Settings (Hidden Weightage Panel) -->
        <div id="admin-settings" class="admin-panel" style="display: none;">
            <strong>Manage Roster & Ratings (B: Bat, W: Bowl)</strong>
            <p style="font-size: 0.75rem; color: var(--text-light); margin-bottom: 8px;">Changes update active sessions and provide updated code snippets for GitHub.</p>
            <div id="roster-editor" style="margin-top: 10px; max-height: 200px; overflow-y: auto;"></div>
