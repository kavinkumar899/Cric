<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekend Cricket Team Splitter</title>
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-light: #94a3b8;
            --border: #334155;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 16px; line-height: 1.5; }
        .container { max-width: 650px; margin: 0 auto; background: var(--card-bg); border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.3); padding: 20px; border: 1px solid var(--border); }
        h1 { font-size: 1.5rem; text-align: center; color: var(--primary); margin-bottom: 4px; }
        .subtitle { text-align: center; color: var(--text-light); font-size: 0.875rem; margin-bottom: 20px; }
        .section { margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
        .section:last-child { border-bottom: none; }
        h2 { font-size: 1.1rem; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; color: var(--text); }
        button { background: var(--primary); color: #000; border: none; padding: 12px 16px; border-radius: 8px; font-weight: 700; cursor: pointer; width: 100%; font-size: 1rem; transition: background 0.2s; }
        button:hover { background: #059669; color: #fff; }
        button.secondary { background: #475569; color: #fff; }
        button.secondary:hover { background: #334155; }
        .player-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; max-height: 300px; overflow-y: auto; padding: 8px; border: 1px solid var(--border); border-radius: 8px; background: #0f172a; }
        .player-chip { display: flex; align-items: center; background: #1e293b; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem; cursor: pointer; user-select: none; font-weight: 500; color: var(--text); }
        .player-chip input { margin-right: 8px; accent-color: var(--primary); width: 16px; height: 16px; cursor: pointer; }
        .teams-container { display: flex; flex-direction: column; gap: 16px; margin-top: 15px; }
        .team-card { background: #0f172a; border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
        .team-title { font-weight: 700; color: var(--primary); margin-bottom: 8px; font-size: 1.05rem; }
        ul { list-style-type: none; padding-left: 0; }
        li { padding: 6px 0; border-bottom: 1px dashed var(--border); font-size: 0.95rem; color: var(--text); }
        li:last-child { border-bottom: none; }
        .admin-panel { background: #334155; border: 1px solid #475569; padding: 12px; border-radius: 8px; margin-bottom: 16px; }
        input[type="text"], input[type="number"], input[type="password"] { width: 100%; padding: 8px; background: #0f172a; color: var(--text); border: 1px solid var(--border); border-radius: 6px; margin-bottom: 8px; }
        .row { display: flex; gap: 8px; }
        .actions-row { display: flex; gap: 8px; margin-top: 10px; }
        .admin-link { font-size: 0.8rem; color: var(--text-light); text-decoration: none; cursor: pointer; }
        .admin-link:hover { text-decoration: underline; color: var(--primary); }
    </style>
</head>
<body>
<div class="container">
    <h1>🏏 Weekend Squad Splitter</h1>
    <p class="subtitle">Select playing members to auto-generate balanced teams</p>

    <!-- Selection Section -->
    <div class="section">
        <h2>Match Day Attendance (<span id="selected-count">0</span> active)
            <span class="admin-link" onclick="toggleAdmin(event)">⚙️ Admin</span>
        </h2>

        <!-- Admin Login -->
        <div id="admin-login" class="admin-panel" style="display: none;">
            <input type="password" id="admin-pin" placeholder="Enter Admin PIN">
            <button onclick="verifyPin()">Unlock Roster Settings</button>
        </div>

        <!-- Admin Settings (Hidden Weightage Panel) -->
        <div id="admin-settings" class="admin-panel" style="display: none;">
            <strong>Manage Roster & Ratings (B: Bat, W: Bowl)</strong>
            <p style="font-size: 0.75rem; color: var(--text-light); margin-bottom: 8px;">Changes update active sessions and provide updated code snippets for GitHub.</p>
            <div id="roster-editor" style="margin-top: 10px; max-height: 200px; overflow-y: auto;"></div>
            <div style="margin-top: 10px; border-top: 1px solid var(--border); padding-top: 8px;">
                <input type="text" id="new-name" placeholder="New Player Name">
                <div class="row">
                    <input type="number" id="new-bat" placeholder="Batting (1-10)" min="1" max="10" step="0.5">
                    <input type="number" id="new-bowl" placeholder="Bowling (1-10)" min="1" max="10" step="0.5">
                </div>
                <button onclick="addPlayer()">Add Player</button>
            </div>
            <button class="secondary" onclick="exportCode()" style="margin-top: 8px;">📥 Copy Updated Code Array</button>
        </div>

        <!-- Search & Checklist -->
        <input type="text" id="search-box" placeholder="Search players..." oninput="filterPlayers()" style="margin-bottom: 8px;">
        <div class="player-grid" id="player-checkboxes"></div>
        <div class="actions-row">
            <button class="secondary" onclick="selectAll(true)">Select All</button>
            <button class="secondary" onclick="selectAll(false)">Clear All</button>
        </div>
    </div>

    <!-- Generator Controls -->
    <div class="section">
        <label style="font-size: 0.9rem; font-weight: 600;">Number of Teams:</label>
        <input type="number" id="num-teams" value="2" min="2" max="4" style="margin-top: 4px;">
        <button onclick="generateTeams()" style="margin-top: 8px;">⚡ Auto-Balance Teams</button>
    </div>

    <!-- Output Teams -->
    <div class="section" id="results-section" style="display:none;">
        <h2>Generated Weekend Teams</h2>
        <div class="teams-container" id="teams-output"></div>
        <button class="secondary" onclick="shareTeams()" style="margin-top: 12px;">📋 Copy Teams to WhatsApp</button>
    </div>
</div>

<script>
    // HARDCODED MASTER ROSTER & WEIGHTAGES
    const defaultRoster = [
        {name: "Arun", bat: 9, bowl: 8.5},
        {name: "Dilip", bat: 8.5, bowl: 9},
        {name: "Dinesh", bat: 8, bowl: 9},
        {name: "Gopi", bat: 9, bowl: 8.5},
        {name: "Karthi Laila", bat: 7.5, bowl: 6},
        {name: "Karthi Das", bat: 9, bowl: 8.5},
        {name: "Kathir", bat: 9, bowl: 8.5},
        {name: "Kavin", bat: 9, bowl: 8.5},
        {name: "Mahesh", bat: 8, bowl: 8.5},
        {name: "Manoj", bat: 7.5, bowl: 8},
        {name: "Naveen Kumar", bat: 9, bowl: 8.5},
        {name: "Naveen Neduvai", bat: 8.5, bowl: 9},
        {name: "Periya Bharathi", bat: 8, bowl: 5},
        {name: "Rahul", bat: 7.5, bowl: 7.5},
        {name: "Rithan", bat: 8, bowl: 4},
        {name: "Rithish", bat: 9, bowl: 8.5},
        {name: "Sathish", bat: 7.5, bowl: 7.5},
        {name: "Selva", bat: 7.5, bowl: 8.5},
        {name: "Siva", bat: 9, bowl: 8.5},
        {name: "Tamil", bat: 9, bowl: 8.5}
    ];

    let roster = [...defaultRoster];
    try {
        let saved = localStorage.getItem('cric_roster_v3');
        if (saved) {
            let parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) {
                roster = parsed;
            }
        }
    } catch(e) {
        roster = [...defaultRoster];
    }

    function saveRoster() {
        localStorage.setItem('cric_roster_v3', JSON.stringify(roster));
    }

    function renderCheckboxes(listToRender) {
        const grid = document.getElementById('player-checkboxes');
        if (!grid) return;
        grid.innerHTML = '';
        listToRender.forEach((p) => {
            const originalIndex = roster.findIndex(item => item.name === p.name);
            grid.innerHTML += `
                <label class="player-chip">
                    <input type="checkbox" value="${originalIndex}" onchange="updateCount()">
                    ${p.name}
                </label>`;
        });
    }

    function filterPlayers() {
        const query = document.getElementById('search-box').value.toLowerCase();
        const filtered = roster.filter(p => p.name.toLowerCase().includes(query));
        renderCheckboxes(filtered);
    }

    function updateCount() {
        const checked = document.querySelectorAll('.player-chip input:checked');
        const countElem = document.getElementById('selected-count');
        if (countElem) countElem.innerText = checked.length;
    }

    function selectAll(status) {
        document.querySelectorAll('.player-chip input').forEach(cb => cb.checked = status);
        updateCount();
    }

    function toggleAdmin(e) {
        e.preventDefault();
        const login = document.getElementById('admin-login');
        if (login) login.style.display = login.style.display === 'none' ? 'block' : 'none';
    }

    function verifyPin() {
        const pinInput = document.getElementById('admin-pin');
        if (pinInput && pinInput.value === '5467') {
            document.getElementById('admin-login').style.display = 'none';
            document.getElementById('admin-settings').style.display = 'block';
            renderEditor();
        } else {
            alert('Incorrect PIN');
        }
    }

    function renderEditor() {
        const editor = document.getElementById('roster-editor');
        if (!editor) return;
        editor.innerHTML = '';
        roster.forEach((p, i) => {
            editor.innerHTML += `
                <div style="display:flex; gap:6px; margin-bottom:6px; align-items:center;">
                    <span style="flex:2; font-size:0.85rem; font-weight:600;">${p.name}</span>
                    <input type="number" value="${p.bat}" min="1" max="10" step="0.5" title="Batting" style="width:55px; margin:0;" onchange="updatePlayerStat(${i}, 'bat', this.value)">
                    <input type="number" value="${p.bowl}" min="1" max="10" step="0.5" title="Bowling" style="width:55px; margin:0;" onchange="updatePlayerStat(${i}, 'bowl', this.value)">
                    <button onclick="removePlayer(${i})" style="width:32px; background:var(--danger); padding:4px; color:#fff;">×</button>
                </div>`;
        });
    }

    function updatePlayerStat(index, field, val) {
        roster[index][field] = parseFloat(val) || 0;
        saveRoster();
    }

    function addPlayer() {
        const nameInput = document.getElementById('new-name');
        const batInput = document.getElementById('new-bat');
        const bowlInput = document.getElementById('new-bowl');
        const name = nameInput ? nameInput.value.trim() : '';
        const bat = batInput ? parseFloat(batInput.value) || 5 : 5;
        const bowl = bowlInput ? parseFloat(bowlInput.value) || 5 : 5;
        if(name) {
            roster.push({name, bat, bowl});
            saveRoster();
            nameInput.value = '';
            batInput.value = '';
            bowlInput.value = '';
            renderCheckboxes(roster);
            updateCount();
            renderEditor();
        }
    }

    function removePlayer(index) {
        roster.splice(index, 1);
        saveRoster();
        renderCheckboxes(roster);
        updateCount();
        renderEditor();
    }

    function exportCode() {
        let codeSnippet = "const defaultRoster = [\n" + roster.map(p => `    {name: "${p.name}", bat: ${p.bat}, bowl: ${p.bowl}}`).join(",\n") + "\n];";
        navigator.clipboard.writeText(codeSnippet).then(() => {
            alert('Roster array copied to clipboard! You can paste this directly into your GitHub index.html file.');
        });
    }

    function generateTeams() {
        const checkedInputs = document.querySelectorAll('.player-chip input:checked');
        if (checkedInputs.length < 2) {
            alert('Please select at least 2 players for this weekend.');
            return;
        }

        let selectedPlayers = Array.from(checkedInputs).map(input => {
            let p = roster[input.value];
            return {
                ...p,
                totalScore: p.bat + p.bowl
            };
        });

        selectedPlayers.sort((a, b) => b.totalScore - a.totalScore);

        const numTeamsInput = document.getElementById('num-teams');
        const numTeams = numTeamsInput ? parseInt(numTeamsInput.value) || 2 : 2;
        let teams = Array.from({length: numTeams}, () => ({ players: [] }));

        let turn = 0;
        let goingDown = true;
        selectedPlayers.forEach(player => {
            teams[turn].players.push(player);

            if (goingDown) {
                turn++;
                if (turn >= numTeams) {
                    turn = numTeams - 1;
                    goingDown = false;
                }
            } else {
                turn--;
                if (turn < 0) {
                    turn = 0;
                    goingDown = true;
                }
            }
        });

        renderTeams(teams);
    }

    function renderTeams(teams) {
        const container = document.getElementById('teams-output');
        if (!container) return;
        container.innerHTML = '';
        teams.forEach((t, index) => {
            let list = t.players.map(p => `<li>${p.name}</li>`).join('');
            container.innerHTML += `
                <div class="team-card">
                    <div class="team-title">Team ${index + 1} (${t.players.length} Players)</div>
                    <ul>${list}</ul>
                </div>`;
        });
        const resultsSection = document.getElementById('results-section');
        if (resultsSection) resultsSection.style.display = 'block';
    }

    function shareTeams() {
        let text = "🏏 *Weekend Cricket Teams*\n\n";
        document.querySelectorAll('.team-card').forEach(card => {
            text += card.innerText + "\n\n";
        });
        navigator.clipboard.writeText(text).then(() => alert('Teams copied to clipboard! Ready to paste into WhatsApp.'));
    }

    // Initialize immediately on script execution and also on DOMContentLoaded to guarantee rendering
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => {
            renderCheckboxes(roster);
            updateCount();
        });
    } else {
        renderCheckboxes(roster);
        updateCount();
    }
</script>
</body>
</html>
